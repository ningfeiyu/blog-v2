<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="nomadGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cryptoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="tiktokGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" orient="auto" markerWidth="8" markerHeight="6">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Header -->
  <g transform="translate(40,42)">
    <circle cx="10" cy="14" r="7" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="20" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="#f1f5f9">数字游民单人操作系统 — 2027</text>
    <text x="28" y="42" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">One-Person × Multi-Leverage × Geo-Arbitrage / AI · USDC · TikTok</text>
  </g>

  <!-- 4 Layer bands -->
  <g font-family="JetBrains Mono, monospace">
    <!-- Layer 1: 行为前端 / Nomad 自身 -->
    <rect x="30" y="100" width="1140" height="100" rx="12" fill="rgba(8,51,68,0.10)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="44" y="118" font-size="11" fill="#22d3ee" font-weight="600">L1 — SINGLE OPERATOR LAYER (你)</text>
    <!-- Operator -->
    <rect x="60" y="130" width="180" height="60" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="150" y="156" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">单人主理人</text>
    <text x="150" y="174" font-size="9" fill="#94a3b8" text-anchor="middle">心智重写 · 地理套利 · 节拍</text>
    <!-- 4 dirs arc -->
    <rect x="270" y="130" width="200" height="60" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1"/>
    <text x="370" y="156" font-size="11" fill="#f1f5f9" text-anchor="middle">如何选址</text>
    <text x="370" y="174" font-size="8" fill="#94a3b8" text-anchor="middle">26°C 月均 · 网速&签证 · 时区同带</text>
    <rect x="490" y="130" width="200" height="60" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1"/>
    <text x="590" y="156" font-size="11" fill="#f1f5f9" text-anchor="middle">工作时间窗</text>
    <text x="590" y="174" font-size="8" fill="#94a3b8" text-anchor="middle">3x 90min 深度块 + 1x 流程块</text>
    <rect x="710" y="130" width="200" height="60" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1"/>
    <text x="810" y="156" font-size="11" fill="#f1f5f9" text-anchor="middle">本地成本 ≤</text>
    <text x="810" y="174" font-size="8" fill="#94a3b8" text-anchor="middle">房租 < USD 600 / 月</text>
    <rect x="930" y="130" width="220" height="60" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1"/>
    <text x="1040" y="156" font-size="11" fill="#f1f5f9" text-anchor="middle">收入结汇方式</text>
    <text x="1040" y="174" font-size="8" fill="#94a3b8" text-anchor="middle">USDC → 本地法币 3 秒到账</text>

    <!-- Layer 2: AI 杠杆 / Cloud -->
    <rect x="30" y="220" width="1140" height="100" rx="12" fill="rgba(120,53,15,0.08)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="44" y="238" font-size="11" fill="#fbbf24" font-weight="600">L2 — AI LEVERAGE STACK (云端算力)</text>
    <rect x="60" y="250" width="170" height="60" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="145" y="276" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">本地 Agent</text>
    <text x="145" y="294" font-size="9" fill="#94a3b8" text-anchor="middle">Hermes · Claude Code</text>
    <rect x="245" y="250" width="170" height="60" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="330" y="276" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">长文写作 Agent</text>
    <text x="330" y="294" font-size="9" fill="#94a3b8" text-anchor="middle">DeepSeek · GLM-5.2 · Claude Opus</text>
    <rect x="430" y="250" width="170" height="60" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="515" y="276" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">视觉生成</text>
    <text x="515" y="294" font-size="9" fill="#94a3b8" text-anchor="middle">ComfyUI · 即梦 · Flux</text>
    <rect x="615" y="250" width="170" height="60" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="700" y="276" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">剪辑自动化</text>
    <text x="700" y="294" font-size="9" fill="#94a3b8" text-anchor="middle">Whisper · Topaz · Runway</text>
    <rect x="800" y="250" width="170" height="60" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="885" y="276" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">RPA / 机器人</text>
    <text x="885" y="294" font-size="9" fill="#94a3b8" text-anchor="middle">Browser-use · AutoGPT</text>
    <rect x="985" y="250" width="165" height="60" rx="8" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1067" y="276" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">边缘函数</text>
    <text x="1067" y="294" font-size="9" fill="#94a3b8" text-anchor="middle">Cloudflare Workers</text>

    <!-- Layer 3: 区块链 / 结算 -->
    <rect x="30" y="340" width="1140" height="100" rx="12" fill="rgba(76,29,149,0.10)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="44" y="358" font-size="11" fill="#a78bfa" font-weight="600">L3 — BLOCKCHAIN SETTLEMENT (链上结算)</text>
    <rect x="60" y="370" width="170" height="60" rx="8" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="145" y="396" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">USDC 收款</text>
    <text x="145" y="414" font-size="9" fill="#94a3b8" text-anchor="middle">Polygon · 0.3% · 3 秒</text>
    <rect x="245" y="370" width="170" height="60" rx="8" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1"/>
    <text x="330" y="396" font-size="11" fill="#f1f5f9" text-anchor="middle">合同/版权存证</text>
    <text x="330" y="414" font-size="9" fill="#94a3b8" text-anchor="middle">Arweave · ENS · IPFS</text>
    <rect x="430" y="370" width="170" height="60" rx="8" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1"/>
    <text x="515" y="396" font-size="11" fill="#f1f5f9" text-anchor="middle">出金通道</text>
    <text x="515" y="414" font-size="9" fill="#94a3b8" text-anchor="middle">MoonPay · Coinbase · Binance</text>
    <rect x="615" y="370" width="170" height="60" rx="8" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1"/>
    <text x="700" y="396" font-size="11" fill="#f1f5f9" text-anchor="middle">本地法币</text>
    <text x="700" y="414" font-size="9" fill="#94a3b8" text-anchor="middle">Bali/清迈/里斯本 P2P</text>
    <rect x="800" y="370" width="170" height="60" rx="8" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1"/>
    <text x="885" y="396" font-size="11" fill="#f1f5f9" text-anchor="middle">Feed/Social on-chain</text>
    <text x="885" y="414" font-size="9" fill="#94a3b8" text-anchor="middle">Lens · Farcaster · Mirror</text>
    <rect x="985" y="370" width="165" height="60" rx="8" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1"/>
    <text x="1067" y="396" font-size="11" fill="#f1f5f9" text-anchor="middle">链上身份</text>
    <text x="1067" y="414" font-size="9" fill="#94a3b8" text-anchor="middle">Gitcoin Passport · Proof of Humanity</text>

    <!-- Layer 4: TikTok 冷启动 / 触达 -->
    <rect x="30" y="460" width="1140" height="100" rx="12" fill="rgba(136,19,55,0.08)" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="44" y="478" font-size="11" fill="#fb7185" font-weight="600">L4 — TIKTOK DISTRIBUTION (冷启动触达)</text>
    <rect x="60" y="490" width="170" height="60" rx="8" fill="rgba(136,19,55,0.45)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="145" y="516" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">3 周冷启动</text>
    <text x="145" y="534" font-size="9" fill="#94a3b8" text-anchor="middle">60 条选题 · 3 模板 · 跑数</text>
    <rect x="245" y="490" width="170" height="60" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1"/>
    <text x="330" y="516" font-size="11" fill="#f1f5f9" text-anchor="middle">Hook 模板池</text>
    <text x="330" y="534" font-size="9" fill="#94a3b8" text-anchor="middle">3 个反复验证过的开头</text>
    <rect x="430" y="490" width="170" height="60" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1"/>
    <text x="515" y="516" font-size="11" fill="#f1f5f9" text-anchor="middle">15 秒切片</text>
    <text x="515" y="534" font-size="9" fill="#94a3b8" text-anchor="middle">长文 → 短脚本转译</text>
    <rect x="615" y="490" width="170" height="60" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1"/>
    <text x="700" y="516" font-size="11" fill="#f1f5f9" text-anchor="middle">Bali-Chiang Mai-里斯本</text>
    <text x="700" y="534" font-size="9" fill="#94a3b8" text-anchor="middle">三主基地轮转</text>
    <rect x="800" y="490" width="170" height="60" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1"/>
    <text x="885" y="516" font-size="11" fill="#f1f5f9" text-anchor="middle">评论抓取 → 选题</text>
    <text x="885" y="534" font-size="9" fill="#94a3b8" text-anchor="middle">浏览器自动化 + LLM 摘要</text>
    <rect x="985" y="490" width="165" height="60" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1"/>
    <text x="1067" y="516" font-size="11" fill="#f1f5f9" text-anchor="middle">10k 粉节点</text>
    <text x="1067" y="534" font-size="9" fill="#94a3b8" text-anchor="middle">突破后启动付费墙</text>
  </g>

  <!-- Inter-layer flows (from L1 to L4) -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)" opacity="0.85">
    <line x1="150" y1="192" x2="145" y2="250"/>
    <line x1="145" y1="310" x2="145" y2="370"/>
    <line x1="145" y1="430" x2="145" y2="490"/>
  </g>
  <text x="158" y="225" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">写 → 发 → 收 → 分发</text>

  <!-- Footer tag line -->
  <text x="600" y="600" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569" text-anchor="middle">一人 · 三层杠杆 · 81 个国家任意落地 · 不卖时间卖触达</text>
</svg>
