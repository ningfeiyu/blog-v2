<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6b8e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4a6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>
  
  <!-- Clouds -->
  <g fill="white" opacity="0.3">
    <ellipse cx="100" cy="60" rx="40" ry="20"/>
    <ellipse cx="130" cy="55" rx="30" ry="18"/>
    <ellipse cx="155" cy="60" rx="25" ry="15"/>
    <ellipse cx="600" cy="40" rx="50" ry="25"/>
    <ellipse cx="640" cy="38" rx="35" ry="20"/>
    <ellipse cx="670" cy="42" rx="30" ry="18"/>
  </g>
  
  <!-- Water -->
  <rect y="200" width="800" height="400" fill="url(#waterGrad)"/>
  
  <!-- Water waves -->
  <g stroke="#3a7ba3" stroke-width="1" fill="none" opacity="0.5">
    <path d="M0,280 Q400,260 800,280"/>
    <path d="M0,320 Q400,340 800,320"/>
    <path d="M0,360 Q400,340 800,360"/>
    <path d="M0,400 Q400,420 800,400"/>
  </g>
  
  <!-- Three layers labels on the left -->
  <g font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">
    <!-- Infrastructure Layer -->
    <rect x="30" y="420" width="180" height="80" rx="8" fill="#1a3a5c" stroke="#3a7ba3" stroke-width="1"/>
    <text x="120" y="445" text-anchor="middle" font-weight="bold" font-size="15">基础设施层</text>
    <text x="120" y="465" text-anchor="middle" font-size="11" fill="#a0c4e8">模型训练 · 超级集群</text>
    <text x="120" y="482" text-anchor="middle" font-size="10" fill="#88aacc">门槛极高 · 一人公司摸不到</text>
    
    <!-- Distribution Layer -->
    <rect x="30" y="320" width="180" height="80" rx="8" fill="#1a4a5c" stroke="#3aa3a3" stroke-width="1"/>
    <text x="120" y="345" text-anchor="middle" font-weight="bold" font-size="15">分发层</text>
    <text x="120" y="365" text-anchor="middle" font-size="11" fill="#a0e8e8">谁看见谁 · 入口之争</text>
    <text x="120" y="382" text-anchor="middle" font-size="10" fill="#88cccc">未定局 · 值得盯但重注太早</text>
    
    <!-- Application Layer -->
    <rect x="30" y="220" width="180" height="80" rx="8" fill="#1a5c4a" stroke="#3aa37a" stroke-width="1"/>
    <text x="120" y="245" text-anchor="middle" font-weight="bold" font-size="15" fill="#88ffcc">应用/内容层 ✓</text>
    <text x="120" y="265" text-anchor="middle" font-size="11" fill="#88ffcc">直接触达用户</text>
    <text x="120" y="282" text-anchor="middle" font-size="10" fill="#88ddbb">结构性优势 · 可落地位置</text>
  </g>
  
  <!-- Boat -->
  <g transform="translate(450, 300)">
    <!-- Boat body -->
    <path d="M-60,0 Q-40,-15 0,-15 Q40,-15 60,0 Q40,10 -60,10 Z" fill="#2d2d2d" stroke="#4a4a4a" stroke-width="2"/>
    <path d="M-40,0 Q-20,-8 0,-8 Q20,-8 40,0" fill="#3d3d3d" opacity="0.8"/>
    
    <!-- Mast -->
    <path d="M0,-15 L0,-70" stroke="#5a4a3a" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Sail -->
    <path d="M0,-70 Q35,-50 0,-30 Q-35,-50 0,-70" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
    <text x="0" y="-50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2d2d2d">Hermes</text>
    
    <!-- Flag -->
    <path d="M0,-70 L20,-60 L0,-55 Z" fill="#e84a4a"/>
    <text x="6" y="-60" text-anchor="middle" font-family="Arial" font-size="9" fill="white">AI</text>
    
    <!-- Person on boat -->
    <circle cx="-15" cy="-25" r="8" fill="#e8d0a0"/>
    <path d="M-23,-25 Q-15,-40 -7,-25" fill="none" stroke="#2d2d2d" stroke-width="2"/>
    <path d="M-15,-33 L-15,-15" stroke="#2d2d2d" stroke-width="2"/>
    <path d="M-20,-28 L-10,-28" stroke="#2d2d2d" stroke-width="2"/>
  </g>
  
  <!-- Wave crest arrow -->
  <g transform="translate(650, 220)">
    <path d="M0,0 Q-30,-30 -60,0 Q-30,30 0,0" fill="none" stroke="#ffd700" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="-30" y="5" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffd700" font-weight="bold">浪的方向 →</text>
  </g>
  
  <!-- Metrics bubbles on the right -->
  <g font-family="Arial, sans-serif" font-size="12" fill="white">
    <g transform="translate(580, 100)">
      <rect x="0" y="0" width="180" height="140" rx="8" fill="#1a3a5c" stroke="#3a7ba3" stroke-width="1" opacity="0.9"/>
      <text x="90" y="25" text-anchor="middle" font-weight="bold" font-size="14" fill="#ffd700">关键指标</text>
      <text x="10" y="50" font-size="11">🤖 Agent可靠度 >30%</text>
      <text x="10" y="70" font-size="11">🔗 MCP协议普及</text>
      <text x="10" y="90" font-size="11">💰 成本降至人工10%</text>
      <text x="10" y="110" font-size="11">👥 用户主动行为偏移</text>
      <text x="90" y="130" text-anchor="middle" font-size="10" fill="#88aacc">比找发布会日期更有意义</text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="400" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">AI 的"iPhone时刻"不会到来</text>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a0c4e8">这反而是好事</text>
  
  <!-- Subtitle -->
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#88aacc" font-style="italic">船只比喻 · 三层结构 · 结构性优势</text>
</svg>