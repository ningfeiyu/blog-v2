<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g stroke="#2a4a5a" stroke-width="0.5" opacity="0.3">
    <line x1="80" y1="60" x2="720" y2="60"/>
    <line x1="80" y1="130" x2="720" y2="130"/>
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="80" y1="270" x2="720" y2="270"/>
    <line x1="80" y1="340" x2="720" y2="340"/>
    <line x1="80" y1="410" x2="720" y2="410"/>
    <line x1="80" y1="480" x2="720" y2="480"/>
    <line x1="80" y1="60" x2="80" y2="480"/>
    <line x1="200" y1="60" x2="200" y2="480"/>
    <line x1="350" y1="60" x2="350" y2="480"/>
    <line x1="500" y1="60" x2="500" y2="480"/>
    <line x1="650" y1="60" x2="650" y2="480"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">关键指标时间线 · 2025-2027 观测窗口</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#88aacc">比寻找发布会日期更有意义的观测指标</text>
  
  <!-- Column headers -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#a0c4e8">
    <text x="140" y="95" text-anchor="middle">时间</text>
    <text x="275" y="95" text-anchor="middle">Agent可靠度</text>
    <text x="425" y="95" text-anchor="middle">MCP协议普及</text>
    <text x="575" y="95" text-anchor="middle">成本/人工比</text>
    <text x="725" y="95" text-anchor="middle">用户行为</text>
  </g>
  
  <!-- Timeline data -->
  <g font-family="Arial, sans-serif" font-size="11" fill="white">
    <!-- 2025 Q1 -->
    <text x="140" y="120" text-anchor="middle" fill="#ffd700">2025 Q1</text>
    <text x="275" y="120" text-anchor="middle" fill="#ff6b6b">≈5-10%</text>
    <text x="425" y="120" text-anchor="middle" fill="#ff6b6b">早期草案</text>
    <text x="575" y="120" text-anchor="middle" fill="#ff6b6b">≈50-80%</text>
    <text x="725" y="120" text-anchor="middle" fill="#ff6b6b">好奇尝鲜</text>
    
    <!-- 2025 Q3 -->
    <text x="140" y="190" text-anchor="middle" fill="#ffd700">2025 Q3</text>
    <text x="275" y="190" text-anchor="middle" fill="#ffaa00">≈15-20%</text>
    <text x="425" y="190" text-anchor="middle" fill="#ffaa00">标准定型</text>
    <text x="575" y="190" text-anchor="middle" fill="#ffaa00">≈30-40%</text>
    <text x="725" y="190" text-anchor="middle" fill="#ffaa00">工作流嵌入</text>
    
    <!-- 2026 Q1 -->
    <text x="140" y="260" text-anchor="middle" fill="#ffd700">2026 Q1</text>
    <text x="275" y="260" text-anchor="middle" fill="#aaffaa">≈25-30% ⚡</text>
    <text x="425" y="260" text-anchor="middle" fill="#aaffaa">工具链成熟</text>
    <text x="575" y="260" text-anchor="middle" fill="#aaffaa">≈15-20%</text>
    <text x="725" y="260" text-anchor="middle" fill="#aaffaa">主动委托</text>
    
    <!-- 2026 Q3 -->
    <text x="140" y="330" text-anchor="middle" fill="#ffd700">2026 Q3</text>
    <text x="275" y="330" text-anchor="middle" fill="#44ff44">>30% ✓ 临界点</text>
    <text x="425" y="330" text-anchor="middle" fill="#44ff44">广泛采纳 ✓</text>
    <text x="575" y="330" text-anchor="middle" fill="#44ff44">≈10% ✓ 拐点</text>
    <text x="725" y="330" text-anchor="middle" fill="#44ff44">习惯依赖</text>
    
    <!-- 2027 -->
    <text x="140" y="400" text-anchor="middle" fill="#ffd700">2027</text>
    <text x="275" y="400" text-anchor="middle" fill="#44ff44">>50% 常态化</text>
    <text x="425" y="400" text-anchor="middle" fill="#44ff44">基础设施化</text>
    <text x="575" y="400" text-anchor="middle" fill="#44ff44"><5% 红利期</text>
    <text x="725" y="400" text-anchor="middle" fill="#44ff44">原生AI用户</text>
  </g>
  
  <!-- Progress bars for Agent Reliability -->
  <g>
    <rect x="200" y="108" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="200" y="108" width="12" height="16" rx="4" fill="#ff6b6b"/>
    
    <rect x="200" y="178" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="200" y="178" width="30" height="16" rx="4" fill="#ffaa00"/>
    
    <rect x="200" y="248" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="200" y="248" width="60" height="16" rx="4" fill="#aaffaa" filter="url(#glow)"/>
    
    <rect x="200" y="318" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="200" y="318" width="84" height="16" rx="4" fill="#44ff44" filter="url(#glow)"/>
    
    <rect x="200" y="388" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="200" y="388" width="120" height="16" rx="4" fill="#44ff44" filter="url(#glow)"/>
  </g>
  
  <!-- Progress bars for Cost Ratio (inverted - lower is better) -->
  <g>
    <rect x="500" y="108" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="500" y="108" width="108" height="16" rx="4" fill="#ff6b6b"/>
    
    <rect x="500" y="178" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="500" y="178" width="72" height="16" rx="4" fill="#ffaa00"/>
    
    <rect x="500" y="248" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="500" y="248" width="36" height="16" rx="4" fill="#aaffaa" filter="url(#glow)"/>
    
    <rect x="500" y="318" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="500" y="318" width="24" height="16" rx="4" fill="#44ff44" filter="url(#glow)"/>
    
    <rect x="500" y="388" width="120" height="16" rx="4" fill="#2a2a3a" stroke="#3a3a4a"/>
    <rect x="500" y="388" width="12" height="16" rx="4" fill="#44ff44" filter="url(#glow)"/>
  </g>
  
  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#88aacc">
    <text x="140" y="455" text-anchor="middle">红=早期  黄=过渡  绿=临界/成熟</text>
    <text x="400" y="455" text-anchor="middle">Agent可靠度>30% + 成本<10% = 分水岭到来信号</text>
    <text x="660" y="455" text-anchor="middle">🟢 绿色区 = 你的船该已在水里</text>
  </g>
  
  <!-- Arrow annotation -->
  <path d="M350,250 L420,250" stroke="#44ff44" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#44ff44"/>
    </marker>
  </defs>
  <text x="385" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#44ff44" font-weight="bold">关键拐点区间</text>
</svg>